<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Поиск СТЕ — Tender Hack Казань</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Поиск стандартных товарных единиц (СТЕ)</h1>

        <form method="GET" action="{{ url_for('search') }}" class="mb-4">
            <div class="input-group">
                <input type="text" name="q" class="form-control" placeholder="Введите название, модель, характеристики..." required>
                <button class="btn btn-primary" type="submit">Найти</button>
            </div>
        </form>

        <!-- Сюда позже подставим результаты -->
        <div id="results">
            {% if query %}
                <p class="text-muted">Вы искали: <strong>{{ query }}</strong></p>
                <!-- Пока просто заглушка -->
                <div class="alert alert-info">Результаты поиска появятся здесь после реализации логики.</div>
            {% endif %}
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
