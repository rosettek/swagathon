<!-- /workspace/application/templates/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильтр SPU ID</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Фильтр по параметрам</h1>
    <label>Бренд:</label>
    <select id="brand-select">
        <option value="">Выберите бренд</option>
    </select>

    <label>Модель:</label>
    <select id="model-select">
        <option value="">Выберите модель</option>
    </select>

    <label>Категория:</label>
    <select id="category-select">
        <option value="">Выберите категорию</option>
    </select>

    <label>Характеристика:</label>
    <select id="characteristic-select">
        <option value="">Выберите характеристику</option>
    </select>

    <div id="spu-list">
        <h2>SPU ID:</h2>
        <p>Результаты будут отображены здесь.</p>
    </div>

    <script>
        function loadOptions(url, selectId) {
            $.get(url, function(data) {
                const select = $(selectId);
                select.empty();
                select.append('<option value="">Выберите значение</option>');
                data.forEach(item => {
                    select.append(`<option value="${item.id}">${item.name}</option>`);
                });
            });
        }

        $(document).ready(function() {
            loadOptions('/api/brands', '#brand-select');
            loadOptions('/api/models', '#model-select');
            loadOptions('/api/categories', '#category-select');
            loadOptions('/api/characteristics', '#characteristic-select');

            $('select').change(function() {
                const params = {};
                const brandId = $('#brand-select').val();
                const modelId = $('#model-select').val();
                const categoryId = $('#category-select').val();
                const characteristicId = $('#characteristic-select').val();

                if (brandId) params.brand_id = brandId;
                if (modelId) params.model_id = modelId;
                if (categoryId) params.category_id = categoryId;
                if (characteristicId) params.characteristic_id = characteristicId;

                $.get('/api/spu_ids', params, function(data) {
                    const list = $('#spu-list');
                    list.empty();
                    list.append('<h2>SPU ID:</h2>');
                    if (data.length === 0) {
                        list.append('<p>Нет совпадений.</p>');
                    } else {
                        data.forEach(id => {
                            list.append(`<p>${id}</p>`);
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
